<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1d4b42" />
    <title>オフライン | CareerQuest</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f5ef; color: #18332e; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
      main { width: min(420px, 100%); border: 1px solid #dfe5de; border-radius: 22px; background: #fffefa; padding: 32px; text-align: center; }
      span { display: grid; width: 48px; height: 48px; margin: 0 auto 18px; place-items: center; border-radius: 14px; background: #1d4b42; color: white; font-size: 13px; font-weight: 800; }
      h1 { margin: 0; font-size: 23px; }
      p { margin: 10px 0 22px; color: #5e706b; font-size: 14px; line-height: 1.7; }
      button { min-height: 44px; border: 0; border-radius: 12px; background: #1d4b42; padding: 0 20px; color: white; font: inherit; font-size: 13px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <span>CQ</span>
      <h1>オフラインです</h1>
      <p>接続が戻ったら、タスクをもう一度読み込めます。</p>
      <button onclick="location.reload()">再読み込み</button>
    </main>
  </body>
</html>
